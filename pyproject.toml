[project]
name = "cxd"
version = "0.1.0"
description = "Analysis code for coherent X-ray diffraction (CXD) data: SPEC parsing, Timepix frame loading, q-space regridding and 3D visualization"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE*"]
authors = [{ name = "Isaac Yong", email = "isaacyong@naver.com" }]
requires-python = ">=3.13"
keywords = ["coherent X-ray diffraction", "BCDI", "SPEC", "Timepix", "reciprocal space"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "matplotlib>=3.10.8",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "pyvista[colormaps]>=0.47.3",
    "qorageom>=0.1.0",
    "roi-rectangle>=1.0.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "tifffile>=2026.4.11",
]

[project.urls]
Homepage = "https://github.com/NaNIsaac/CXD"
Repository = "https://github.com/NaNIsaac/CXD"
Issues = "https://github.com/NaNIsaac/CXD/issues"
Changelog = "https://github.com/NaNIsaac/CXD/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.9.17,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "pytest>=9.0.3",
    "pyvista[jupyter]>=0.47.3",
    "qoraphase>=0.2",
    "ruff>=0.15.10",
]

# qorageom is not on PyPI yet; drop this entry once it is released
[tool.uv.sources]
qorageom = { git = "https://github.com/NaNIsaac/QoraGeom" }

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]

# violations present when ruff became mandatory in CI; remove entries as they are fixed
[tool.ruff.lint.extend-per-file-ignores]
"notebooks/notebook.ipynb" = ["I001"]
"notebooks/streak_mapping.ipynb" = ["B007", "B905", "F811", "F841", "I001", "RUF059"]
"scripts/analyze_raw.py" = ["B905", "C417", "I001", "RUF059"]
"scripts/orientation_map.py" = ["I001"]
"scripts/streak_profiles.py" = ["RUF059"]
"src/cxd/core/statistics.py" = ["I001"]
"src/cxd/core/transform.py" = ["RUF059"]
"src/cxd/gam_del.py" = ["I001", "RUF059"]
"src/cxd/mapping/orientation_view.py" = ["I001"]
"src/cxd/mapping/profiles_view.py" = ["B905", "RUF059"]
"src/cxd/mapping/vtk_view.py" = ["B007", "I001"]
"src/cxd/twin_finder.py" = ["I001"]
"tests/conftest.py" = ["I001"]
"tests/test_mapping.py" = ["I001", "RUF059"]
