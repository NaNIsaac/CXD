[project]
name = "cxd"
version = "0.1.0"
description = "Analysis code for coherent X-ray diffraction (CXD) data: SPEC parsing, Timepix frame loading, q-space regridding and 3D visualization"
readme = "README.md"
authors = [{ name = "Isaac Yong", email = "isaacyong@naver.com" }]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.10.8",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "pyvista[colormaps]>=0.47.3",
    "qorageom @ git+https://github.com/NaNIsaac/QoraGeom",
    "roi-rectangle>=1.0.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "tifffile>=2026.4.11",
]

[project.urls]
Homepage = "https://github.com/NaNIsaac/CXD"
Repository = "https://github.com/NaNIsaac/CXD"

[build-system]
requires = ["uv_build>=0.9.17,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "pytest>=9.0.3",
    "pyvista[jupyter]>=0.47.3",
    "qoraphase>=0.2",
    "ruff>=0.15.10",
]

[tool.ruff]
line-length = 100

# violations present when ruff became mandatory in CI; remove entries as they are fixed
[tool.ruff.lint.extend-per-file-ignores]
"notebooks/notebook.ipynb" = ["I001"]
"notebooks/streak_mapping.ipynb" = ["F811", "F841", "I001", "RUF059"]
"scripts/analyze_raw.py" = ["C417", "I001", "RUF059"]
"scripts/orientation_map.py" = ["I001"]
"scripts/streak_profiles.py" = ["RUF059"]
"src/cxd/core/statistics.py" = ["I001"]
"src/cxd/core/transform.py" = ["RUF059"]
"src/cxd/gam_del.py" = ["I001", "RUF059"]
"src/cxd/mapping/orientation_view.py" = ["I001"]
"src/cxd/mapping/profiles.py" = ["RUF059"]
"src/cxd/mapping/vtk_view.py" = ["I001"]
"src/cxd/twin_finder.py" = ["I001"]
"tests/conftest.py" = ["I001"]
"tests/test_mapping.py" = ["I001", "RUF059"]
