[project]
name = "cxd_map"
version = "0.1.0"
description = "BCDI peak analysis: streak and facet directions from a 3D diffraction pattern"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.2.0",
    "matplotlib>=3.10.8",
    "napari[all]>=0.6.5",
    "numpy>=2.4.4",
    "pyvista>=0.47.2",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "trame>=3.12.0",
    "vtk>=9.6.0",
]
